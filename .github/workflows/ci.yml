name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: medora-ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: '4000'
      APP_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: medora-ci-only-password
      DB_NAME: medora_ci_placeholder
      JWT_SECRET: medora-ci-only-signing-key-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 8h
      SUPER_ADMIN_USERNAME: ci_admin
      SUPER_ADMIN_PASSWORD: CiOnlyPassword123!
      SUPER_ADMIN_FULL_NAME: CI Admin
      SUPER_ADMIN_EMAIL: ci-admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Build backend
        run: npm run build
        working-directory: backend
      - name: Verify clean database setup and seed
        run: npm run db:setup
        working-directory: backend
      - name: Run fresh-database integration checks
        run: npm run test:integration
        working-directory: backend
