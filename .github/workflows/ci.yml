name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: medora-ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: '4000'
      APP_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: medora-ci-only-password
      DB_NAME: medora_ci_placeholder
      JWT_SECRET: medora-ci-only-signing-key-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 8h
      SUPER_ADMIN_USERNAME: ci_admin
      SUPER_ADMIN_PASSWORD: CiOnlyPassword123!
      SUPER_ADMIN_FULL_NAME: CI Admin
      SUPER_ADMIN_EMAIL: ci-admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Audit backend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - name: Build backend
        run: npm run build
        working-directory: backend
      - name: Verify clean database setup and seed
        run: npm run db:setup
        working-directory: backend
      - name: Run fresh-database integration checks
        run: npm run test:integration
        working-directory: backend

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: medora-ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: '4000'
      APP_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: medora-ci-only-password
      DB_NAME: medora_ci_browser_smoke
      JWT_SECRET: medora-ci-only-signing-key-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 8h
      SUPER_ADMIN_USERNAME: ci_admin
      SUPER_ADMIN_PASSWORD: CiOnlyPassword123!
      SUPER_ADMIN_FULL_NAME: CI Admin
      SUPER_ADMIN_EMAIL: ci-admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Prepare browser smoke database
        run: npm run db:setup
        working-directory: backend
      - name: Run deterministic browser smoke
        shell: bash
        run: |
          google-chrome --version
          (cd backend && npm run start > "$RUNNER_TEMP/medora-backend.log" 2>&1) &
          backend_pid=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/medora-frontend.log" 2>&1) &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/medora-backend.log" "$RUNNER_TEMP/medora-frontend.log"' EXIT
          for attempt in {1..60}; do
            curl --fail --silent --show-error http://127.0.0.1:4000/health && curl --fail --silent --show-error http://127.0.0.1:5173/login > /dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4000/health
          cd backend && npm run browser:smoke:ci

  production-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://medora.test
      FRONTEND_URL: https://medora.test
      DB_NAME: medora_ci_release
      MYSQL_APP_USER: medora_app
      COMPOSE_PROJECT_NAME: medora_release_ci
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable release credentials
        shell: bash
        run: |
          for key in MYSQL_ROOT_PASSWORD DB_PASSWORD JWT_SECRET SUPER_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Build and start the production stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Check the production frontend, readiness and authentication boundary
        shell: bash
        run: |
          curl --retry 5 --retry-connrefused -fsS http://127.0.0.1/login | grep -q 'id="root"'
          curl -fsS http://127.0.0.1/health/ready | jq -e '.success and .data.database == "ready"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/api/patients)" = 401
      - name: Verify production seed excludes sample stock and beds
        run: |
          counts=$(docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -Nse "SELECT (SELECT COUNT(*) FROM inventory_batches) + (SELECT COUNT(*) FROM beds)"')
          test "$counts" = 0
      - name: Show container status
        if: failure()
        run: docker compose ps -a
      - name: Stop disposable release stack
        if: always()
        run: docker compose down --volumes
